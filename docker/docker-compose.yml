name: daily-stock-analysis

services:
  server:
    # CI build 后推送到 Docker Hub，本地直接使用镜像
    image: docker.io/ishowlight/daily-stock-analysis:main
    # 本地开发时取消下面注释，用本地 build
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: dsa-server
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../.env:/app/.env
      - ../strategies:/app/strategies:ro
    environment:
      - TZ=Asia/Shanghai
      - WEBUI_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dsa-network

  analyzer:
    image: docker.io/ishowlight/daily-stock-analysis:main
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: dsa-analyzer
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../.env:/app/.env
      - ../strategies:/app/strategies:ro
    environment:
      - TZ=Asia/Shanghai
    command: ["python", "main.py", "--schedule", "--time", "18:00"]
    networks:
      - dsa-network

  watchtower:
    image: containrrr/watchtower
    container_name: dsa-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 3600 --scope dsa server analyzer
    networks:
      - dsa-network

networks:
  dsa-network:
    driver: bridge
